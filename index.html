<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>戏份盘点</title>
<meta name="theme-color" content="#0e0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刀笔娘子">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:dark;--bg:#0e0e11;--bg2:#15151a;--card:#17171c;--ink:#ece8df;--mute:#8d8a85;--line:#2a2a31;--accent:#d9b56c;--accent2:#d9b56c;--chip:#202027;--bar:linear-gradient(90deg,#8a6a2f,#e0bf7a);--glow:rgba(201,163,92,.14);--pink:#ff4fa3}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
 background:radial-gradient(900px 420px at 15% -10%,var(--glow),transparent 70%),radial-gradient(700px 360px at 100% 0,rgba(90,110,160,.10),transparent 70%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
header{padding:34px 20px 14px;max-width:1840px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{font:600 28px/1.2 "Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;margin:0;letter-spacing:.16em;color:#f3ecd9}
h1::after{content:"";display:block;width:44px;height:2px;margin-top:10px;background:var(--accent)}
h1 small{display:block;font:400 12px/1 sans-serif;letter-spacing:.08em;color:var(--mute);margin:8px 0 0}
main{max-width:1840px;margin:0 auto;padding:0 20px 70px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--ink);transition:.18s;letter-spacing:.03em}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#2a2208;font-weight:600}
button.primary:hover{background:#f5e0aa;color:#2a2208}
button.danger{color:#d98a7a}
button.danger:hover{border-color:#d98a7a;color:#e8a798}
select,input,textarea{border:1px solid var(--line);background:#101014;padding:7px 10px;border-radius:6px;min-width:0;outline:none;transition:border-color .18s}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px;box-shadow:0 20px 50px -30px #000}
.card h2{font-size:16px;margin:0 0 12px}
.tabs{display:flex;gap:26px;margin:16px 0 0;padding:0 4px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 2px;color:var(--mute);letter-spacing:.12em}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
td.wrap{white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:12px;letter-spacing:.12em;border-bottom-color:#3a3a43}
tfoot th{color:var(--accent);font-size:13px;border-bottom:0}
tr.row:hover{background:rgba(255,255,255,.07)}
.chip{display:inline-block;background:var(--chip);border:1px solid #2c2c34;border-radius:4px;padding:0 8px;margin:2px 3px 2px 0;font-size:12.5px;color:#d8d3c8}
.chip.z{opacity:.55;border:1px dashed #55555e;background:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:6px;background:#23232a;border-radius:3px;min-width:120px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bar);border-radius:3px}
.sum{display:flex;gap:12px;flex-wrap:wrap}
.sum div{background:#121217;border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:110px}
.sum b{display:block;font:600 24px/1.2 "Songti SC","Noto Serif CJK SC",serif;color:#f3ecd9}
.sum span{font-size:12px;color:var(--mute);letter-spacing:.06em}
dialog{border:1px solid #34343c;border-radius:14px;background:#141418;color:var(--ink);padding:22px;width:min(720px,94vw);max-height:92vh;box-shadow:0 30px 80px -20px #000}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
dialog h2{font:600 18px "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.1em;color:#f3ecd9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mute);letter-spacing:.06em}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;font-size:15px;color:var(--ink)}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.roles button{padding:3px 12px;border-radius:999px;font-size:13px;color:#bbb6ab}
.roles button.s1{background:var(--accent);border-color:var(--accent);color:#2a2208;font-weight:600}
.roles button.s2{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--mute)}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.opt .chip button{border:0;background:none;padding:0 0 0 6px;color:var(--mute)}
.opt .chip button.rn{padding:0 2px 0 6px}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1}
.foot{margin-top:18px;display:flex;justify-content:flex-end;gap:8px}
.adm[hidden],[hidden]{display:none!important}
.chip.pink{background:var(--pink);border-color:var(--pink);color:#3b0a66;font-weight:600;box-shadow:0 0 10px rgba(255,79,163,.45)}
.chip.pink.z{background:none;color:#3b0a66;box-shadow:none;border-style:dashed;opacity:1}
.roles button.pink{border-color:var(--pink);color:var(--pink)}
.roles button.pink.s1{background:var(--pink);border-color:var(--pink);color:#fff}
.roles button.pink.s2{border-style:dashed}
tr.pinkrow td b{color:#3b0a66;background:var(--pink);padding:2px 10px;border-radius:4px;box-shadow:0 0 10px rgba(255,79,163,.4)}
tr.pinkrow .meter i{background:linear-gradient(90deg,#d83686,#ff7cc0)}
.sortb{padding:3px 12px;font-size:13px}.sortb.on{background:linear-gradient(180deg,#fbefc6,#ecd196);border-color:#fbefc6;color:#2a210a;font-weight:600}
.empty{color:var(--mute);padding:28px;text-align:center}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#33333b;border-radius:4px}
/* --- 提亮:标题 / 选中状态 --- */
h1{display:inline-block;font-size:34px;font-weight:700;letter-spacing:.18em;padding:10px 26px 10px 28px;color:#2a210a;
 background:linear-gradient(135deg,#fbefc6 0%,#f0d58f 55%,#e3bf6a 100%);border-radius:8px;
 box-shadow:0 10px 30px -8px rgba(255,226,150,.45),inset 0 1px 0 rgba(255,255,255,.7)}
h1::after{display:none}
h1 small{color:#6b5a2c;letter-spacing:.06em;font-weight:500}
.tabs button.on{background:linear-gradient(180deg,#fbefc6,#ecd196);color:#2a210a;border-radius:8px 8px 0 0;border-color:#fbefc6;font-weight:700;padding:8px 18px}
.tabs button:not(.on){padding:8px 18px}
.tabs button:not(.on):hover{color:#fbefc6}
select:focus,input:focus,textarea:focus{border-color:#fbefc6;box-shadow:0 0 0 3px rgba(251,239,198,.28);background:#1b1b21}
select:hover,input:hover,textarea:hover{border-color:#cfcfc8}
tr.row:hover{background:rgba(251,239,198,.11);box-shadow:inset 3px 0 0 #fbefc6}
button:hover{border-color:#fbefc6;color:#fbefc6;background:rgba(251,239,198,.08)}
button.primary:hover{background:#fff1c8;color:#2a210a}
.roles button.s1{background:linear-gradient(180deg,#fbefc6,#ecd196);border-color:#fbefc6;color:#2a210a;box-shadow:0 0 12px rgba(251,239,198,.4)}
.roles button.s2{border-color:#fbefc6;color:#fbefc6}
.roles button:hover{border-color:#fbefc6}
.roles button.pink.s1{background:var(--pink);border-color:#ff9ccc;color:#3b0a66;box-shadow:0 0 12px rgba(255,79,163,.55)}
dialog{border-color:#3a3a43}
@media(max-width:600px){header{padding-top:24px}h1{font-size:23px}.card{padding:14px}}
/* --- 以 app 方式开启时避开刘海 / 状态栏 / 底部横条 --- */
header{padding-top:calc(34px + env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-bottom:calc(70px + env(safe-area-inset-bottom))}
@media(max-width:600px){header{padding-top:calc(24px + env(safe-area-inset-top))}}
/* --- 顶部横幅 --- */
.banner{position:relative;display:flex;align-items:flex-end;min-height:clamp(120px,16vw,205px);
 background:#0e0e11 url(banner.jpg) 50% 61%/cover no-repeat}
.banner::before{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(90deg,rgba(14,14,17,.9) 0,rgba(14,14,17,.6) 36%,rgba(14,14,17,0) 66%),
  linear-gradient(180deg,rgba(14,14,17,0) 66%,var(--bg) 100%)}
.banner header{position:relative;width:100%;flex-direction:row;align-items:flex-end;justify-content:space-between;
 gap:12px 20px;padding:calc(env(safe-area-inset-top) + 16px) 20px 16px}
.banner h1{padding:0;background:none;box-shadow:none;border-radius:0;font-size:clamp(24px,3.6vw,38px);letter-spacing:.2em;
 color:#fbefc6;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.banner h1 small{color:#cdbf94;font-size:12px;letter-spacing:.08em;text-shadow:none}
.banner h1 small:empty{display:none}
.banner .bar button:not(.primary){background:rgba(14,14,17,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media(max-width:600px){
 .banner{min-height:185px;background-size:100% auto;background-position:50% -169px}
 .banner::before{background:linear-gradient(180deg,rgba(14,14,17,.05) 0,rgba(14,14,17,0) 35%,rgba(14,14,17,.65) 75%,var(--bg) 100%)}
 .banner header{flex-direction:column;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top) + 20px) 14px 12px}
 .banner h1{font-size:23px;letter-spacing:.12em}
 .banner .bar{gap:5px}
 .banner .bar button{padding:4px 9px;font-size:13px}
}
/* --- 手机:卡片排版,不用左右滑动 --- */
.mcards{display:none}
.sc-card,.st-card{background:#121217;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sc-card:active{background:#1a1a21}
.sc-card .h,.st-card .h{display:flex;align-items:baseline;gap:10px}
.sc-card .h b{color:var(--accent);font-size:16px}
.sc-card .h span{color:var(--ink);font-size:14px}
.sc-card .h em{margin-left:auto;font-style:normal;font:600 19px/1 "Songti SC","Noto Serif CJK SC",serif;color:#f3ecd9;font-variant-numeric:tabular-nums}
.sc-card .h small{font:400 11px sans-serif;color:var(--mute);margin-left:2px}
.sc-card .m{margin-top:5px;font-size:12.5px;color:var(--mute)}
.sc-card .t{margin-top:6px;font-size:15px;line-height:1.5}
.sc-card .c{margin-top:8px}
.mcards .tot{color:var(--accent);font-size:13px;padding:2px 4px 6px}
.st-card .h{margin-bottom:8px}
.st-card .no{color:var(--mute);font-size:12px;min-width:18px}
.st-card .h b{font-size:16px}
.st-card .r{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px;font-size:13px}
.st-card .r span{color:var(--mute);min-width:32px}
.st-card .r strong{font:600 17px/1 "Songti SC","Noto Serif CJK SC",serif;color:#f3ecd9}
.st-card .r em{margin-left:auto;font-style:normal;color:var(--accent);font-variant-numeric:tabular-nums}
.st-card.pinkrow .h b{color:#3b0a66;background:var(--pink);padding:2px 10px;border-radius:4px;box-shadow:0 0 10px rgba(255,79,163,.4)}
.st-card.pinkrow .meter i{background:linear-gradient(90deg,#d83686,#ff7cc0)}
/* 排版切换:默认电脑版(表格),选「手机版」后套用卡片排版 */
.tabrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px}
.vsw{display:flex;align-items:center;gap:6px;margin-top:16px;padding-bottom:6px}
.vsw .hint{margin-right:2px}
.vsw button{padding:3px 12px;font-size:13px;border-radius:999px;color:var(--mute)}
.vsw button.on{background:linear-gradient(180deg,#fbefc6,#ecd196);border-color:#fbefc6;color:#2a210a;font-weight:600}
body.mview main{max-width:600px;padding:0 12px 50px}
body.mview .mtable{display:none}
body.mview .mcards{display:block}
body.mview .tabs{gap:14px}
.pie{padding:4px 0 6px}
.pie h3{margin:6px 0 4px;font:600 18px "Songti SC","Noto Serif CJK SC",serif;color:#f3ecd9;letter-spacing:.1em}
.pie h3 small{display:block;font:400 12px sans-serif;color:var(--mute);letter-spacing:.04em;margin-top:4px}
.pieby{margin:6px 0 2px;align-items:center}
.pieby button{padding:3px 12px;font-size:13px;border-radius:999px;color:var(--mute)}
.pieby button.on{background:linear-gradient(180deg,#fbefc6,#ecd196);border-color:#fbefc6;color:#2a210a;font-weight:600}
.note{margin:14px auto 4px;max-width:560px;padding:12px 14px;border:1px solid #3a3a43;border-left:3px solid var(--accent);border-radius:8px;background:#1b1b21;font-size:13px;line-height:1.7;color:var(--ink)}
#vStats>.note{max-width:none;margin:0 0 14px}
.note b{display:block;color:var(--accent);margin-bottom:2px;letter-spacing:.06em}
.note p{margin:3px 0;color:#cfcac0}
.piebtn{margin-top:16px;margin-bottom:6px;padding:3px 14px;font-size:13px;border-radius:999px;color:var(--mute)}
.piebtn.on{background:linear-gradient(180deg,#fbefc6,#ecd196);border-color:#fbefc6;color:#2a210a;font-weight:600}
.epbtn{margin-left:10px;padding:6px 16px;font-size:14px;font-weight:700;border-radius:999px;border:1px solid #fbefc6;background:linear-gradient(180deg,#fbefc6,#e5bf6c);color:#2a210a;box-shadow:0 0 0 0 rgba(251,239,198,.7),0 3px 10px rgba(217,181,108,.35);animation:epglow 2.4s ease-out infinite}
/* 手机上:管理按钮排成一行,放不下就左右滑动,不换行 */
@media(max-width:700px){header .bar{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px;scrollbar-width:none}header .bar::-webkit-scrollbar{display:none}header .bar button{flex:none;white-space:nowrap;padding:6px 10px;font-size:13px}}
.sortbar{flex-wrap:nowrap;gap:6px}
.sortbar .hint{white-space:nowrap}
.sortbar button{white-space:nowrap;flex:none}
@media(max-width:480px){.epbtn{margin-left:2px;padding:5px 11px;font-size:13px}.sortb{padding:3px 10px}}
@media(max-width:350px){.sortbar .hint{display:none}.epbtn{padding:5px 8px;font-size:12px}}
.epbtn:hover{filter:brightness(1.06);color:#2a210a}
@keyframes epglow{0%{box-shadow:0 0 0 0 rgba(251,239,198,.65),0 3px 10px rgba(217,181,108,.35)}70%,100%{box-shadow:0 0 0 10px rgba(251,239,198,0),0 3px 10px rgba(217,181,108,.35)}}
@media(prefers-reduced-motion:reduce){.epbtn{animation:none}}
#ddlg .foot{flex-wrap:nowrap}
#ddlg .foot button{white-space:nowrap;flex:none}
#ddlg .foot #ddBack{background:#3b4a9a;border-color:#6b7bd6;color:#fff;font-weight:600}
#ddlg .foot #ddBack:hover{background:#4a5bb8;border-color:#9aa7ee;color:#fff}
.rolelink{cursor:pointer}
b.rolelink{border-bottom:1px dotted var(--accent);padding-bottom:1px}
b.rolelink::after{content:" ›";color:var(--accent);font-weight:400}
/* 其他角色(非祝阮/阮卿卿)的标签:深蓝灰底 #282e52 */
.chip.rc:not(.pink),#ddlg .chip.rc:not(.pink){background:#282e52;border-color:#4a5388;color:#e9ecff}
.chip.rolelink:hover{border-color:var(--accent);color:#fff3d1}
.rolehint{margin:0 0 8px;font-size:12.5px;color:#cbbf9e}
.rolehint b{color:var(--accent)}
.rolelink:hover{text-decoration:underline;text-underline-offset:3px}
#rdlg{width:min(560px,94vw);max-height:86vh;padding:14px 16px;border-radius:12px;border:1px solid #6d6880;background:linear-gradient(160deg,#3d394b,#2d2b38);color:#f2eefb;box-shadow:0 24px 60px -16px #000}
#rdlg::backdrop{background:rgba(0,0,0,.55)}
#rdlg h2{margin:0 0 4px;font-size:17px;color:#fff3d1}
.rdsum{font-size:13px;color:#d9d4e6;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px 16px}
.rdsum b{color:#fff3d1;font-size:15px}
.rdlist{max-height:58vh;overflow:auto;border-top:1px solid rgba(255,255,255,.18)}
.rrow{display:grid;grid-template-columns:96px 74px 54px 1fr;gap:8px;align-items:baseline;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:13px}
.rrow:hover{background:rgba(255,255,255,.08)}
.rrow b{color:#fff3d1}
.rrow .pg{text-align:right;font-variant-numeric:tabular-nums}
.rrow .sm{color:#cfc9de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.rrow{grid-template-columns:84px 1fr 52px}.rrow .sm{grid-column:1/-1}}
.epc{margin-top:18px}
.epc h3{margin:0 0 4px;font:600 16px "Songti SC","Noto Serif CJK SC",serif;color:#f3ecd9;letter-spacing:.1em}
.epleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 10px;font-size:12.5px;color:var(--ink)}
.epleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.eprow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:5px 0}
.eplab{font-size:13px;line-height:1.3}.eplab small{display:block;color:var(--mute);font-size:11px}
.epbar{display:flex;height:26px;border-radius:5px;overflow:hidden;background:#101014}
.epbar div{display:flex;align-items:center;justify-content:center;font:600 11px sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);overflow:hidden;white-space:nowrap;border-right:1px solid #17171c;min-width:0}
.pieback{font-size:14px;font-weight:600;padding:6px 16px;border-radius:999px;color:var(--accent);border:1px solid var(--accent);background:rgba(217,181,108,.12);margin-top:4px}
.pieback:hover{background:rgba(217,181,108,.24);color:#fbefc6;border-color:#fbefc6}
.pie svg{display:block;width:100%;max-width:520px;height:auto;margin:6px auto}
.pie .pl{fill:#fff;font:700 15px sans-serif;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:3px;stroke-linejoin:round}
.pie .pl.p2{font-size:13px;font-weight:600}
.pie .pl.out{font-size:13px;fill:var(--ink);stroke:#17171c}
.plegend{list-style:none;margin:8px auto 0;padding:0;max-width:520px}
.plegend li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #2f2f37}
.plegend i{width:14px;height:14px;border-radius:4px;flex:none}
.plegend b{font-weight:600;flex:1}
.plegend span{color:var(--mute);font-size:13px}
.plegend em{font-style:normal;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:99999;max-width:min(92vw,520px);padding:12px 18px;border-radius:12px;font:600 16px/1.4 sans-serif;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:10px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.busy{background:#2b4f8f}
.toast.ok{background:#1f7a46}
.toast.fail{background:#b3261e;pointer-events:auto;cursor:pointer}
.toast.busy::before{content:"";width:16px;height:16px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none}
.toast.ok::before{content:"✓";font-size:18px}
.toast.fail::before{content:"✕";font-size:18px}
@keyframes sp{to{transform:rotate(360deg)}}
.srow{display:flex;gap:8px;align-items:flex-end;flex:1 1 280px}
.srow>label:first-child{flex:1;min-width:0}
.srow input#fQ{width:100%;box-sizing:border-box}
.pchk{display:flex!important;flex-direction:row!important;align-items:center;gap:6px;white-space:nowrap;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px;background:#101014}
.pchk input{width:auto;margin:0;accent-color:var(--accent)}
/* 筛选区:手机版卡片、或手机屏幕上(不论哪种排版)都是 三个选单一排 + 搜寻独占一行 */
body.mview .card > .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
body.mview .card > .bar label select{padding:7px 6px;font-size:14px}
body.mview .card > .bar label.full,body.mview .card > .bar .srow{grid-column:1/-1}
@media(max-width:700px){
 .card > .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .card > .bar label select{padding:7px 6px;font-size:14px}
 .card > .bar label.full,.card > .bar .srow{grid-column:1/-1}
}
/* 祝阮/阮卿卿:亮金色字(底色略加深,金字才看得清) */
:root{--gold:#fff3c4;--goldshadow:0 1px 2px rgba(120,0,60,.6),0 0 1px rgba(120,0,60,.6)}
.chip.pink{background:var(--pink);border-color:var(--pink);color:var(--gold);text-shadow:var(--goldshadow)}
.chip.pink.z{background:none;border-color:var(--pink);color:var(--gold);text-shadow:none}
.roles button.pink{color:var(--gold)}
.roles button.pink.s1,.roles button.pink.s2{color:var(--gold)}
.roles button.pink.s1{background:var(--pink);border-color:#ff9ccc;text-shadow:var(--goldshadow)}
tr.pinkrow td b,.st-card.pinkrow .h b{color:var(--gold);background:var(--pink);text-shadow:var(--goldshadow)}
/* 现场照片 */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
#pPrev{display:block;margin-top:8px;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:#0b0b0e}
#ddPhoto{margin:0 0 8px}
#ddPhoto img{display:block;width:100%;max-height:260px;object-fit:contain;background:#1f1d28;border-radius:7px;border:1px solid rgba(255,255,255,.14);cursor:zoom-in}
#ddlg.hasPhoto{width:min(440px,94vw)}
#pdlg{width:auto;max-width:96vw;padding:6px;background:#000;border-color:#555;cursor:zoom-out}
#pdlg img{display:block;max-width:calc(96vw - 12px);max-height:calc(92vh - 12px);object-fit:contain;border-radius:8px}
.sc-photo{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid var(--line);cursor:zoom-in}
.cam{position:absolute;left:0;top:12px;font-size:7px;line-height:1;opacity:.9;pointer-events:none} /* 贴在行首、不占位,不会撑大栏位 */
/* 左右滑动时,日期/集/场 三栏固定在左边,方便对照后面的内容 */
#vScenes .mtable thead th:nth-child(-n+2),#vScenes .mtable tbody td:nth-child(-n+2){position:sticky;background:#17171c;z-index:2}
#vScenes .mtable thead th:nth-child(-n+2){z-index:3;background:#1b1b21}
#vScenes .mtable thead th:nth-child(1),#vScenes .mtable tbody td:nth-child(1){left:0}
#vScenes .mtable thead th:nth-child(2),#vScenes .mtable tbody td:nth-child(2){left:var(--l2,70px)}
#vScenes .mtable thead th:nth-child(2),#vScenes .mtable tbody td:nth-child(2){box-shadow:6px 0 8px -6px rgba(0,0,0,.7);border-right:1px solid #3a3a43}
#vScenes .mtable tbody tr.row:hover td:nth-child(-n+2){background:#2a2923}
.sc-card .h .cam{position:static;font-size:12px;margin-right:-4px}
/* 场次表:行与行之间的分隔线加深 */
#vScenes tbody td{border-bottom:1px solid #5c5c68}
#vScenes tbody tr:last-child td{border-bottom-color:#7a7a86}
tr.row{cursor:pointer}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none;transition:color .15s}
th.sortable:hover{color:var(--ink)}
th.sortable.sorted{color:var(--accent)}
th.sortable i{display:inline-block;width:1.1em;font-style:normal;font-size:10px;text-align:center;color:var(--accent)}
body.mview .sc-card{cursor:default}
body.mview.adminOn .sc-card{cursor:pointer}
.hintCard{display:none}
body.mview .hintTable{display:none}
body.mview .hintCard{display:block}
/* 场次详情小视窗 */
#ddlg{width:min(300px,94vw);padding:11px 12px;border-radius:10px;border-color:#6d6880;
 background:linear-gradient(160deg,#3d394b,#2d2b38);box-shadow:0 24px 60px -16px #000}
#ddlg h2{margin:0 0 7px;font-size:14px;color:#fff3d1}
/* 信息格子:短的挤在同一行,长的(主/次场景)各占半行,总共约 3 行 */
.dgrid{display:flex;flex-wrap:wrap;gap:4px}
.dgrid div{flex:1 1 auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 7px;min-width:0}
.dgrid div.wide{flex:1 1 28%}
.dgrid span{display:block;font-size:9.5px;line-height:1.3;color:#b9b4c6;letter-spacing:.03em;white-space:nowrap}
.dgrid b{display:block;font-weight:500;font-size:12px;line-height:1.3;overflow-wrap:anywhere;color:#fff}
.dgrid .nv,.dtext .nv{color:#8a8599;font-style:normal}
.dsec{margin-top:7px}
.dsec>span{display:block;font-size:9.5px;color:#b9b4c6;letter-spacing:.03em;margin-bottom:3px}
.dtext{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:4px 8px;font-size:12px;white-space:pre-wrap;line-height:1.45;overflow-wrap:anywhere;color:#fff}
#ddlg .roles{gap:4px}
#ddlg .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#f2eefb;font-size:10.5px;line-height:1.5;padding:0 6px;margin:0}
#ddlg .chip.pink{background:var(--pink);border-color:var(--pink);color:var(--gold)}
#ddlg .hint{color:#b9b4c6;font-size:11px}
#ddlg .foot{margin-top:8px;gap:5px}
#ddlg .foot button{padding:3px 11px;font-size:12px}
#ddlg .foot button:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
/* 统计摘要:四个小框同一排,各有不同底色 */
.sum{flex-wrap:nowrap;gap:8px}
.sum div{flex:0 1 auto;min-width:0;padding:9px 14px;border-radius:9px}
.sum b{font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.sum span{display:block;font-size:11px;letter-spacing:.04em;margin-top:1px;color:rgba(236,232,223,.62)}
.sum div:nth-child(1){background:rgba(217,181,108,.15);border-color:rgba(217,181,108,.4)}
.sum div:nth-child(1) b{color:#f5e0aa}
.sum div:nth-child(2){background:rgba(110,150,225,.15);border-color:rgba(110,150,225,.4)}
.sum div:nth-child(2) b{color:#c3d5fa}
.sum div:nth-child(3){background:rgba(255,79,163,.13);border-color:rgba(255,79,163,.38)}
.sum div:nth-child(3) b{color:#ffbddb}
.sum div:nth-child(4){background:rgba(80,190,160,.14);border-color:rgba(80,190,160,.38)}
.sum div:nth-child(4) b{color:#b0ead8;font-size:16px}
@media(max-width:600px){
 .sum{gap:6px}
 .sum div{flex:1 1 auto;padding:7px 8px}
 .sum b{font-size:16px}
 .sum div:nth-child(4) b{font-size:13px}
 .sum span{font-size:10.5px;letter-spacing:0}
}

<body>
<div class="banner">
<header>
  <h1 id="title">戏份盘点<small id="saved"></small></h1>
  <div class="bar">
    <button class="primary adm" id="addScene" hidden>+ 新增场次</button>
    <button class="adm" id="manage" hidden>选单/角色管理</button>
    <button class="adm" id="exp" hidden>导出 JSON</button>
    <button id="csv">导出 CSV</button>
    <button class="adm" id="imp" hidden>导入 JSON</button>
    <button class="adm danger" id="reset" hidden>还原网站数据</button>
    <button id="login">管理员登录</button>
    <button id="logout" class="danger" hidden>退出管理员</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>
</div>
<main>
  <div class="tabrow">
    <div class="tabs"><button data-t="scenes" class="on">场次表</button><button data-t="stats">戏份占比结算</button></div>
    <div class="vsw" role="group" aria-label="排版"><span class="hint">排版</span><button data-v="table" class="on">电脑版</button><button data-v="card">手机版</button></div>
    <button type="button" class="piebtn" id="pieBtn" hidden>圆饼图</button>
  </div>

  <div class="card" style="margin-top:0;border-top-left-radius:0;border-top-right-radius:0">
    <div class="bar" id="filterBar" style="margin-bottom:12px">
      <label>集数<select id="fEp"></select></label>
      <label>拍摄日期<select id="fDate"></select></label>
      <label>角色<select id="fRole"></select></label>
      <div class="full srow"><label>搜寻<input id="fQ" placeholder="场景、内容…"></label><label class="pchk"><input type="checkbox" id="fPhoto">📷 只看有照片</label></div>
    </div>
    <div id="vScenes" class="scroll"></div>
    <div id="vStats" hidden></div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dTitle" style="margin-top:0">场次</h2>
    <div class="grid">
      <label>拍摄日期<input name="d1" type="date" min="2026-01-01" max="2027-12-31"></label>
      <label>截止日期<input name="d2" type="date" min="2026-01-01" max="2027-12-31"><span class="hint" style="margin-top:3px">备注:未跨日,不需要选</span></label>
      <label>集数<select name="ep" required><option value="">请选择</option></select></label>
      <label>场号<input name="sc" required placeholder="如 4C、26A"></label>
      <label>景光<input name="light" list="l-light"></label>
      <label>景别(地点)<input name="place" list="l-place"></label>
      <label>主场景<input name="main" list="l-main"></label>
      <label>次场景<input name="sub" list="l-sub"></label>
      <label>页数<input name="pages" placeholder="0.5;闪回填 /"></label>
    </div>
    <label style="margin-top:10px">内容概要<textarea name="summary" rows="2"></textarea></label>
    <div style="margin-top:12px" id="photoBox">
      <label>现场照片(选填,拍摄时的场景)</label>
      <div class="pbar">
        <input type="file" id="pFile" accept="image/*" hidden>
        <button type="button" id="pPick">上传图片</button>
        <button type="button" class="danger" id="pClear" hidden>移除照片</button>
        <span class="hint" id="pHint">上传后会自动压缩,不会占太多空间。</span>
      </div>
      <img id="pPrev" alt="现场照片预览" hidden>
    </div>
    <div style="margin-top:12px">
      <label>有戏份的角色</label>
      <div class="hint">点一下选中=该角色在此场有戏(计入本场页数),再点一下取消。空白=没有戏份。</div>
      <div class="roles" id="dRoles"></div>
    </div>
    <div class="foot">
      <button type="button" class="danger" id="dDel">删除此场</button>
      <span style="flex:1"></span>
      <button type="button" id="dCancel">取消</button>
      <button class="primary" id="dSave">储存</button>
    </div>
  </form>
</dialog>

<dialog id="pdlg"><img id="pBig" alt="现场照片"></dialog>

<dialog id="ddlg">
  <h2 id="ddTitle">场次</h2>
  <div id="ddPhoto" hidden><img alt="现场照片" title="点一下看大图"></div>
  <div class="dgrid" id="ddGrid"></div>
  <div class="dsec"><span>内容概要</span><div class="dtext" id="ddSum"></div></div>
  <div class="dsec"><span id="ddCastLab">有戏份的角色</span><div class="roles" id="ddCast" style="margin-top:0"></div></div>
  <div class="foot">
    <button type="button" id="ddBack" hidden></button>
    <button type="button" class="primary" id="ddEdit" hidden>编辑此场</button>
    <button type="button" id="ddClose">关闭</button>
  </div>
</dialog>

<dialog id="rdlg">
  <h2 id="rdTitle">角色</h2>
  <div class="rdsum" id="rdSum"></div>
  <div class="rdlist" id="rdList"></div>
  <div class="foot"><button type="button" id="rdClose">关闭</button></div>
</dialog>

<dialog id="mdlg">
  <h2 style="margin-top:0">选单/角色管理</h2>
  <p class="hint">选单选项会自动收录场次里出现过的内容;这里可以额外预设选项。删除选项不会改动既有场次。</p>
  <div id="mBody"></div>
  <div class="foot"><button id="mCancel">取消</button><button class="primary" id="mClose">完成</button></div>
</dialog>

<dialog id="ldlg">
  <form id="lform">
    <h2 style="margin-top:0">管理员登录</h2>
    <label>账号<input name="u" autocomplete="username" required></label>
    <label style="margin-top:10px">密码<input name="p" type="password" autocomplete="current-password" required></label>
    <label style="margin-top:10px" id="tokRow" hidden>GitHub 令牌(每台设备第一次登录时填一次)<input name="t" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <div id="lerr" class="hint" style="color:var(--accent);min-height:18px;margin-top:8px"></div>
    <div class="foot" style="margin-top:6px"><button type="button" id="lCancel">取消</button><button class="primary">登录</button></div>
  </form>
</dialog>

<datalist id="l-date"></datalist><datalist id="l-light"></datalist><datalist id="l-place"></datalist><datalist id="l-main"></datalist><datalist id="l-sub"></datalist>

<script>
const KEY='xifen-v1';
let S={title:'戏份盘点',roles:[],scenes:[],opts:{light:[],place:[],main:[],sub:[]}};
let ADMIN=false;
let tab='scenes', editing=null, draft={}, PIE=false, EPV=false, PREVTAB='scenes', PIEBY='p';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toString();
const PINK='祝阮/阮卿卿';
const cut=s=>String(s||'').replace(/\n/g,' ');

/* ---- 数据来源 ----
   SERVER=true:网站有 Cloudflare 数据库(/api/data),所有人看到同一份,管理员改了立刻同步给大家。
   SERVER=false:没有数据库(例如本机直接打开),退回「只存在这个浏览器」的旧做法,仍可用。 */
let SERVER=false,REV=0,TOK='';
/* GitHub 模式:网站放在 GitHub Pages(静态)时,数据就是仓库里的 data.json。
   所有人打开时直接从 GitHub 读最新的 data.json;管理员保存时把它提交回仓库,所以大家看到的永远是同一份。 */
const GH_REPO='jwjw-888/wjy_dramas',GH_FILE='data.json',GH_API='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
const GHMODE=/^https?:$/.test(location.protocol)&&/\.github\.io$/.test(location.hostname);
let GHSHA='',GHTOK='',GHBASE=null;const SHAS=new Set();
try{GHTOK=localStorage.getItem('xifen-gh')||''}catch(_){}
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=t=>{let b='';new TextEncoder().encode(t).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
/* 令牌用「账号|密码」加密后存在 data.json 的 sec 栏位:其他管理员只输账号密码,就能解开并保存。 */
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64u=a=>{let b='';a.forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
async function secKey(pw,salt){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function secSeal(tok,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await secKey(pw,salt),new TextEncoder().encode(tok)));
  return b64u([...salt,...iv,...ct]);
}
async function secOpen(blob,pw){
  try{
    const a=u8(blob),salt=a.slice(0,16),iv=a.slice(16,28),ct=a.slice(28);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},await secKey(pw,salt),ct));
  }catch(e){return null}
}
const PHCACHE={}; // 刚上传的照片:部署完成前先用本机的图显示
const phSrc=p=>PHCACHE[p]||p;
async function uploadPhotoGH(dataUrl){ // 照片存进仓库 photos/ 资料夹,data.json 里只记路径
  const path='photos/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
  let last=0;
  for(let i=0;i<5;i++){
    const r=await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:{accept:'application/vnd.github+json',authorization:'Bearer '+GHTOK,'content-type':'application/json'},
      body:JSON.stringify({message:'网站上传照片',content:dataUrl.split(',')[1],branch:'main'})});
    if(r.ok){PHCACHE[path]=dataUrl;return path}
    last=r.status;
    if(r.status===401||r.status===403||r.status===404)break;
    await new Promise(z=>setTimeout(z,1200*(i+1))); // GitHub 正在更新分支时稍等再试
  }
  throw new Error('上传照片失败('+last+')');
}
async function fetchGH(auth,fresh){ // fresh=true:保存时用,绝不读缓存;否则用「条件请求」,没变化时 GitHub 回 304,不占读取次数
  if(auth===undefined)auth=true; // 有令牌就带上(读取次数限制宽很多)
  try{
    const h={accept:'application/vnd.github+json'};
    if(auth&&GHTOK)h.authorization='Bearer '+GHTOK;
    const go=()=>fetch(GH_API+'?ref=main'+(fresh?'&t='+Date.now():''),{headers:h,cache:fresh?'no-store':'no-cache'});
    let r=await go();
    if(r.status===401&&h.authorization){delete h.authorization;r=await go()} // 令牌失效也要能读
    if(!r.ok)return null;
    const j=await r.json();
    return {sha:j.sha,data:JSON.parse(b64d(j.content))};
  }catch(e){return null}
}
try{TOK=sessionStorage.getItem('xifen-tok')||''}catch(_){}
function adopt(d){
  S=Object.assign({opts:{}},d);
  S.scenes.forEach(s=>{for(const r in s.cast)if(s.cast[r]!==1)delete s.cast[r]});
  S.opts=Object.assign({light:[],place:[],main:[],sub:[]},S.opts);
}
async function fetchServer(){
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&typeof j.rev==='number'?j:null;
  }catch(e){return null}
}
async function load(){
  let d=null;
  const sv=GHMODE?null:await fetchServer();
  if(sv){SERVER=true;REV=sv.rev;d=sv.data}
  if(GHMODE){const g=await fetchGH();if(g){setBase(g.sha,g.data);d=g.data}}
  if(!d){ // 没有服务器数据(或还没人存过):沿用 本地修改 → data.json → 内建数据
    if(!GHMODE)try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!d){
      try{const r=await fetch('data.json',{cache:'no-cache'});if(r.ok)d=await r.json()}catch(e){}
    }
    if(!d)d=JSON.parse($('#seed').textContent);
  }
  adopt(d);
  if(SERVER&&!TOK)ADMIN=false; // 服务器模式下,没有通过服务器验证就不是管理员
  if(GHMODE&&!GHTOK)ADMIN=false;
  if(GHMODE)document.body.classList.add('gh');
  $('#saved').textContent='';
  render();
}
/* 同步状态:屏幕下方的大提示(同步中=蓝、成功=绿、失败=红,失败要点一下才收起) */
(function(){
  const t=$('#toast'),src=$('#saved');let timer=0;
  new MutationObserver(()=>{
    const x=src.textContent.trim();clearTimeout(timer);
    if(!x){t.classList.remove('on');return}
    const kind=/^同步中/.test(x)?'busy':/失败|无法/.test(x)?'fail':'ok';
    t.className='toast on '+kind;t.textContent=x+(kind==='fail'?'(点一下关闭)':'');
    if(kind==='ok')timer=setTimeout(()=>t.classList.remove('on'),4000);
  }).observe(src,{childList:true,characterData:true,subtree:true});
  t.onclick=()=>{if(t.classList.contains('fail'))t.classList.remove('on')};
})();
/* 回到页面时自动拉取别人的更新(没有开着窗口、也不在保存时才换) */
async function refreshFromServer(){
  if(GHMODE){
    if(pushing||document.querySelector('dialog[open]'))return;
    const g=await fetchGH();
    if(g&&g.sha!==GHSHA&&!SHAS.has(g.sha)){setBase(g.sha,g.data);adopt(g.data);render()}
    return;
  }
  if(!SERVER||pushing||document.querySelector('dialog[open]'))return;
  const sv=await fetchServer();
  if(sv&&sv.data&&sv.rev!==REV){REV=sv.rev;adopt(sv.data);render()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFromServer()});
setInterval(()=>{if(document.visibilityState==='visible')refreshFromServer()},20000);

const authHdr=()=>({authorization:'Bearer '+TOK});
let pushing=false,pushQ=Promise.resolve();
async function uploadPhotoData(dataUrl){ // 把 data:image/jpeg;base64,... 传到服务器,换回网址
  const blob=await (await fetch(dataUrl)).blob();
  const r=await fetch('/api/photo',{method:'POST',headers:{...authHdr(),'content-type':'image/jpeg'},body:blob});
  if(!r.ok)throw new Error('photo '+r.status);
  return (await r.json()).url;
}
function pushServer(){
  pushQ=pushQ.then(async()=>{
    pushing=true;$('#saved').textContent='同步中…';
    try{
      for(const s of S.scenes)if(s.photo&&s.photo.startsWith('data:'))s.photo=await uploadPhotoData(s.photo); // 旧的本地照片一并搬上去
      const r=await fetch('/api/data',{method:'PUT',headers:{...authHdr(),'content-type':'application/json'},body:JSON.stringify({baseRev:REV,data:S})});
      if(r.ok){REV=(await r.json()).rev;$('#saved').textContent='已同步,所有人都看得到'}
      else if(r.status===409){
        $('#saved').textContent='';pushing=false;
        alert('别人刚刚更新过数据,你这次的修改没有保存。\n页面会重新载入最新内容,请再改一次。');
        await load();
      }
      else if(r.status===401){
        $('#saved').textContent='';doLogout();
        alert('管理员验证失效,请重新登录后再试。');
      }
      else if(r.status===413)$('#saved').textContent='数据太大,没有同步(请减少照片)';
      else $('#saved').textContent='同步失败,请稍后再试';
    }catch(e){$('#saved').textContent='同步失败(网络),请稍后再试'}
    pushing=false;
  });
  return pushQ;
}
function mergeData(base,mine,theirs){ // 三方合并:我改过的以我为准,其余用别人最新的
  const J=x=>JSON.stringify(x),out=JSON.parse(J(theirs));
  for(const k of Object.keys(mine))if(k!=='scenes'&&J(mine[k])!==J(base[k]))out[k]=mine[k];
  const bm=new Map(base.scenes.map(x=>[x.id,x])),mm=new Map(mine.scenes.map(x=>[x.id,x]));
  let sc=theirs.scenes.filter(x=>{ // 我删掉的场次(基准里有、我这里没有)就删
    return !(bm.has(x.id)&&!mm.has(x.id)&&J(bm.get(x.id))===J(x)) });
  const idx=new Map(sc.map((x,n)=>[x.id,n]));
  for(const x of mine.scenes){
    const b=bm.get(x.id);
    if(b&&J(b)===J(x))continue; // 我没改过:保留别人的版本
    if(idx.has(x.id))sc[idx.get(x.id)]=x;else sc.push(x); // 我改过或新增:用我的
  }
  out.scenes=sc;return out;
}
function setBase(sha,data){GHSHA=sha;GHBASE=JSON.parse(JSON.stringify(data));SHAS.add(sha)}
function pushGH(){
  pushQ=pushQ.then(async()=>{
    pushing=true;$('#saved').textContent='同步中…';
    const sleep=ms=>new Promise(z=>setTimeout(z,ms));
    try{
      if(!GHSHA||!GHBASE){ // 打开页面时没读到 GitHub 的版本(例如读取被限制):先补读
        const c=await fetchGH(true,true);
        if(!c){$('#saved').textContent='同步失败:读不到 GitHub 上的最新数据,请稍后再试';pushing=false;return}
        S=mergeData(c.data,S,c.data);setBase(c.sha,c.data);
      }
      for(const x of S.scenes)if(x.photo&&String(x.photo).startsWith('data:'))x.photo=await uploadPhotoGH(x.photo);
      let done=false,merged=false;
      for(let i=0;i<7&&!done;i++){
        const out=JSON.parse(JSON.stringify(S));
        const r=await fetch(GH_API,{method:'PUT',headers:{accept:'application/vnd.github+json',authorization:'Bearer '+GHTOK,'content-type':'application/json'},
          body:JSON.stringify({message:'网站更新数据 '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64e(JSON.stringify(out,null,1)+'\n'),sha:GHSHA,branch:'main'})});
        if(r.ok){setBase((await r.json()).content.sha,out);done=true;break}
        if(r.status===409||r.status===422){ // 版本对不上:可能是别人刚改过,也可能只是 GitHub 还在更新
          await sleep(1200*(i+1));
          const cur=await fetchGH(true,true);
          if(!cur||cur.sha===GHSHA||SHAS.has(cur.sha))continue; // 暂时的/读到旧版:稍后再试
          S=mergeData(GHBASE,S,cur.data);setBase(cur.sha,cur.data);merged=true;render();
          continue;
        }
        if(r.status===401||r.status===403||r.status===404){
          $('#saved').textContent='';
          try{localStorage.removeItem('xifen-gh')}catch(_){}
          GHTOK='';doLogout();
          alert('GitHub 令牌无效、已过期或没有写入权限。请仓库主人用新的令牌重新登录一次。');
          pushing=false;return;
        }
        $('#saved').textContent='同步失败('+r.status+'),请稍后再试';pushing=false;return;
      }
      $('#saved').textContent=done?(merged?'已同步(已合并别的管理员的更新)':'已同步到 GitHub,所有人打开都是最新的'):'同步失败,请稍后再试';
    }catch(e){$('#saved').textContent='同步失败:'+(e&&e.message?e.message:'网络问题')+',请稍后再试'}
    pushing=false;
  });
  return pushQ;
}
function save(){
  if(GHMODE){if(ADMIN&&GHTOK)pushGH();return}
  let ok=true;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false} // 本地备份
  if(SERVER){if(ADMIN&&TOK)pushServer();return}
  $('#saved').textContent=ok?'已储存於此浏览器':'无法储存(请用导出 JSON 备份)';
}
function commit(){save();render()}

const num=v=>typeof v==='number'?v:null;

/* 排序:点表头的字;同一列点第一次=递增,再点=递减。默认按集数递增,每次打开都从这里开始 */
let SORT={key:'ep',dir:1};
const COLS=[['date','日期'],['ep','集'],['sc','场'],['light','景光'],['place','地点'],['main','主场景'],['sub','次场景'],['summary','内容概要'],['pages','页','num'],['cast','角色']];
function sorted(){
  const k=s=>parseInt(s.sc)||0;
  const byEp=(a,b)=>a.ep-b.ep||k(a)-k(b)||String(a.sc).localeCompare(String(b.sc),'zh',{numeric:true});
  const dk=s=>{const m=String(s.date||'').match(/(\d{1,2})\.(\d{1,2})/);return m?(+m[1])*100+(+m[2]):null}; // 跨天取第一个 月.日
  const txt=f=>s=>{const t=cut(s[f]).trim();return t||null};
  const val={ // 取每一场在该列的排序值;null=空白,永远排在最后
    date:dk, ep:s=>s.ep||null, sc:s=>k(s)||null, light:txt('light'), place:txt('place'), main:txt('main'), sub:txt('sub'), summary:txt('summary'),
    pages:s=>num(s.pages), cast:s=>S.roles.filter(r=>s.cast[r]).length||null
  }[SORT.key];
  const cmp=(x,y)=>typeof x==='string'||typeof y==='string'?String(x).localeCompare(String(y),'zh',{numeric:true}):x-y;
  return [...S.scenes].sort((a,b)=>{
    const x=val(a),y=val(b);
    if(x===null&&y!==null)return 1;
    if(y===null&&x!==null)return -1;
    return (x===null?0:cmp(x,y)*SORT.dir)||byEp(a,b);
  });
}
function sortHead(){

}
function uniq(a){return [...new Set(a.filter(Boolean))]}

function fillFilters(){

  $('#fDate').innerHTML='<option value="">全部</option>'+dates.map(e=>`<option>${esc(e)}</option>`).join('');

function renderScenes(rows){

  const chipsOf=s=>S.roles.filter(r=>s.cast[r]).map(r=>`<span class="chip rc ${s.cast[r]===2?'z':''} ${r===PINK?'pink':''}">${esc(r)}</span>`).join('');

/* 每集戏份分布:每集一条横条,按角色页数占比分段(颜色和圆饼图一致) */
function epChart(rows){
  const eps=uniq(rows.map(s=>s.ep)).sort((a,b)=>a-b);
  if(!eps.length)return'<div class="epc"><button class="pieback" type="button">← 返回长条图</button><p class="hint">还没有场次资料。</p></div>';
  const tot={};rows.forEach(s=>S.roles.forEach(r=>{if(s.cast[r]===1)tot[r]=(tot[r]||0)+(num(s.pages)||0)}));
  const top=Object.keys(tot).filter(r=>tot[r]>0&&!/配角/.test(r)).sort((a,b)=>tot[b]-tot[a]).slice(0,6);
  let ci=0;const col={};top.forEach(r=>col[r]=r===PINK?'#ff4fa3':PIE_COL[ci++%PIE_COL.length]);
  const segs=eps.map(ep=>{
    const rs=rows.filter(s=>s.ep===ep),pages=rs.reduce((a,s)=>a+(num(s.pages)||0),0);
    const per={};rs.forEach(s=>S.roles.forEach(r=>{if(s.cast[r]===1)per[r]=(per[r]||0)+(num(s.pages)||0)}));
    const sum=Object.values(per).reduce((a,b)=>a+b,0);
    const parts=top.filter(r=>per[r]>0).map(r=>({n:r,p:per[r],c:col[r]}));
    const rest=sum-parts.reduce((a,x)=>a+x.p,0);if(rest>0.0001)parts.push({n:'其他',p:rest,c:PIE_OTHER});
    return`<div class="eprow"><div class="eplab"><b>第${esc(ep)}集</b><small>${fmt(pages)} 页 · ${rs.length} 场</small></div><div class="epbar">${sum?parts.map(x=>{const pc=x.p/sum*100;return`<div style="flex:${x.p} 1 0;background:${x.c}" title="${esc(x.n)} ${fmt(x.p)} 页 · ${pc.toFixed(1)}%">${pc>=12?Math.round(pc)+'%':''}</div>`}).join(''):'<span style="color:#6f6c68;font-size:11px;padding:0 10px;line-height:26px">这一集还没有页数资料</span>'}</div></div>`;
  }).join('');
  const leg=top.map(r=>`<span><i style="background:${col[r]}"></i>${esc(r)}</span>`).join('')+`<span><i style="background:${PIE_OTHER}"></i>其他</span>`;
  return`<div class="epc"><button class="pieback" type="button">← 返回长条图</button><h3>每集戏份分布(按页数)</h3><div class="note"><b>这张图怎么看</b><p>每一条是一集;条里各色块是各角色在这一集的页数占比(该角色页数 ÷ 这一集所有角色页数加总),颜色和圆饼图相同。</p><p>色块越宽,代表那个角色在这一集的戏越重;鼠标移上去(手机长按)可以看到页数。左边的页数和场次数是这一集的实际总量。</p></div>
    <div class="epleg">${leg}</div>${segs}</div>`;
}

let draftPhoto='';
function drawPhoto(){
  const has=!!draftPhoto;
  $('#pPrev').hidden=!has;if(has)$('#pPrev').src=phSrc(draftPhoto);else $('#pPrev').removeAttribute('src');
  $('#pClear').hidden=!has;$('#pPick').textContent=has?'更换图片':'上传图片';
  $('#pHint').textContent=has?(draftPhoto.startsWith('data:')?`已压缩,约 ${Math.round(draftPhoto.length*0.75/1024)} KB`:'已上传'):'上传后会自动压缩,不会占太多空间。';
}
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const enc=(max,q)=>{
        const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r));
        const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
        return c.toDataURL('image/jpeg',q);
      };
      let out=enc(1000,.72);
      if(out.length>350000)out=enc(800,.6); // 仍然太大就再压一次
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};
    img.src=url;
  });
}

  $('#mBody').innerHTML=h;
  const B=$('#mBody');
  B.querySelector('[data-addr]').onclick=()=>{const v=$('#newRole').value.trim();if(!v)return;if(S.roles.includes(v))return alert('已有这个角色');S.roles.push(v);save();drawManage();render()};
  $('#newRole').onkeydown=e=>{if(e.key==='Enter')B.querySelector('[data-addr]').click()};
  B.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{
    const old=S.roles[+b.dataset.ren],n=(prompt('新名称',old)||'').trim();
    if(!n||n===old)return;if(S.roles.includes(n))return alert('已有这个角色');
    S.roles[+b.dataset.ren]=n;S.scenes.forEach(s=>{if(old in s.cast){s.cast[n]=s.cast[old];delete s.cast[old]}});save();drawManage();render()});
  B.querySelectorAll('[data-delr]').forEach(b=>b.onclick=()=>{
    const r=S.roles[+b.dataset.delr];if(!confirm(`删除角色「${r}」?各场次中的纪录也会移除。`))return;
    S.roles.splice(+b.dataset.delr,1);S.scenes.forEach(s=>delete s.cast[r]);save();drawManage();render()});
  B.querySelectorAll('[data-addo]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.addo,i=B.querySelector(`[data-newo="${f}"]`),v=i.value.trim();if(!v)return;
    if(!S.opts[f].includes(v))S.opts[f].push(v);save();drawManage();render()});
  B.querySelectorAll('[data-newo]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')B.querySelector(`[data-addo="${i.dataset.newo}"]`).click()});
  B.querySelectorAll('[data-delo]').forEach(b=>b.onclick=()=>{
    const[f,i]=b.dataset.delo.split('|'),o=lists[f][+i];
    S.opts[f]=S.opts[f].filter(x=>x!==o);save();drawManage();render()});
  // 改名:同步改掉所有场次里用到这个名称的地方;若新名称已存在则合并
  B.querySelectorAll('[data-reno]').forEach(b=>b.onclick=()=>{
    const[f,i]=b.dataset.reno.split('|'),old=lists[f][+i];
    const n=(prompt(`${LAB[f]}改名`,old)||'').trim();
    if(!n||n===old)return;
    if(lists[f].includes(n)&&!confirm(`「${n}」已经存在。要把「${old}」合并成「${n}」吗?`))return;
    S.opts[f]=uniq((S.opts[f]||[]).map(x=>x===old?n:x));
    S.scenes.forEach(s=>{if(cut(s[f])===old)s[f]=n});
    save();drawManage();render()});
}

  const lines=[head.map(q).join(',')];
  sorted().forEach(s=>lines.push([s.date,s.ep,s.sc,s.light,s.place,cut(s.main),cut(s.sub),cut(s.summary),num(s.pages)!==null?s.pages:s.pnote,...S.roles.map(r=>s.cast[r]===1?s.pages:'')].map(q).join(',')));

/* ---- admin login ---- */
/* 注意:这是纯前端的登录,只是隐藏编辑功能;账号密码以哈希形式存放在网页里。 */
const AUTH='2d64c3532ae8a4ae12bc97dbcb25dc01a314b712d3ec04ce15394bcf9f7d40d3';
function sha256(s){
  const K=[];let p=2;while(K.length<64){let ok=true;for(let i=2;i*i<=p;i++)if(p%i===0){ok=false;break}if(ok)K.push(Math.floor((Math.cbrt(p)%1)*4294967296));p++}
  let H=[];p=2;while(H.length<8){let ok=true;for(let i=2;i*i<=p;i++)if(p%i===0){ok=false;break}if(ok)H.push(Math.floor((Math.sqrt(p)%1)*4294967296));p++}
  const b=Array.from(new TextEncoder().encode(s)),l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,c,d,e,f,g,h2,j]=H;
    for(let i=0;i<64;i++){const S1=R(f,6)^R(f,11)^R(f,25),ch=(f&g)^(~f&h2),t1=(j+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;
      j=h2;h2=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
    H=[H[0]+a,H[1]+c,H[2]+d,H[3]+e,H[4]+f,H[5]+g,H[6]+h2,H[7]+j].map(x=>x|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
$('#login').onclick=()=>{$('#lform').reset();$('#lerr').textContent='';$('#tokRow').hidden=!(GHMODE&&!GHTOK&&!S.sec);$('#ldlg').showModal()};
$('#lCancel').onclick=()=>$('#ldlg').close();
const makeTok=(u,p)=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify({u,p}))));
$('#lform').onsubmit=async e=>{
  e.preventDefault();const f=e.target,u=f.u.value.trim(),p=f.p.value;
  if(SERVER){ // 有数据库:账号密码交给服务器验证(网页里不存放密码)
    $('#lerr').textContent='验证中…';
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({u,p})});
      if(r.ok){
        TOK=makeTok(u,p);ADMIN=true;
        try{sessionStorage.setItem('xifen-admin','1');sessionStorage.setItem('xifen-tok',TOK)}catch(_){}
        $('#ldlg').close();render();
      }else if(r.status===401)$('#lerr').textContent='账号或密码不正确';
      else $('#lerr').textContent='服务器还没有设定管理员账号密码(请到 Cloudflare 后台设定)';
    }catch(_){$('#lerr').textContent='连不上服务器,请稍后再试'}
    return;
  }
  if(GHMODE){ // GitHub 模式:账号密码通过后,还要有能写入仓库的令牌
    if(sha256(u+'|'+p)!==AUTH){$('#lerr').textContent='账号或密码不正确';return}
    const typed=(f.t.value||'').trim();
    $('#lerr').textContent='验证中…';
    let t=typed||GHTOK;
    if(!t&&S.sec)t=await secOpen(S.sec,u+'|'+p)||''; // 其他管理员:用账号密码解开已存的令牌
    if(!t){$('#tokRow').hidden=false;$('#lerr').textContent=S.sec?'无法取得令牌,请找仓库主人重新设定':'请填入 GitHub 令牌(仓库主人第一次登录时设定)';return}
    try{
      const r=await fetch('https://api.github.com/repos/'+GH_REPO,{headers:{accept:'application/vnd.github+json',authorization:'Bearer '+t}});
      const j=r.ok?await r.json():null;
      if(!j||!j.permissions||!j.permissions.push){$('#tokRow').hidden=false;$('#lerr').textContent='这个令牌不能写入仓库,请检查权限(Contents: Read and write)';return}
      GHTOK=t;try{localStorage.setItem('xifen-gh',t)}catch(_){}
      ADMIN=true;try{sessionStorage.setItem('xifen-admin','1')}catch(_){}
      if(typed){S.sec=await secSeal(t,u+'|'+p);save()} // 主人输入令牌时,加密存起来给其他管理员用
      $('#ldlg').close();render();
    }catch(_){$('#lerr').textContent='连不上 GitHub,请稍后再试'}
    return;
  }
  if(sha256(u+'|'+p)===AUTH){ // 没有数据库时的旧做法(只在这个浏览器里有效)
    ADMIN=true;try{sessionStorage.setItem('xifen-admin','1')}catch(_){}
    $('#ldlg').close();render();
  }else $('#lerr').textContent='账号或密码不正确';
};
function doLogout(){ADMIN=false;TOK='';try{sessionStorage.removeItem('xifen-admin');sessionStorage.removeItem('xifen-tok')}catch(_){}render()}
$('#logout').onclick=doLogout;
